<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="pgko API reference" />
    <title>pgko API reference</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      .docs-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid #ddd;
        background: #fff;
        color: #222;
      }
      .docs-header a {
        color: inherit;
      }
      .docs-header strong {
        margin-right: auto;
      }
      #loading {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"><p id="loading" role="status">Loading API reference…</p></div>
    <noscript>JavaScript is required for the API reference.</noscript>
    <script src="./scalar.js"></script>
    <script>
      if (window.Scalar) {
        Scalar.createApiReference("#app", {
          url: "./openapi.json",
          theme: "default",
          withDefaultFonts: false,
          hideClientButton: true,
          hideTestRequestButton: true,
          showOperationId: true,
          persistAuth: false,
          agent: { disabled: true },
          mcp: { disabled: true },
        });
      } else {
        document.getElementById("loading").textContent = "The API reference could not load.";
      }
    </script>
  </body>
</html>
