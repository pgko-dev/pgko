name: Deploy web

on:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Bypass verification checks"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true
          fetch-depth: 0

      - name: Pull LFS objects
        run: git lfs pull

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Check and build web
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SKIP_CHECKS" != "true" ]]; then
            bun run check
          else
            bun run build:web
          fi
        env:
          SKIP_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_checks }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_COOKIE_DOMAIN: ${{ secrets.PUBLIC_COOKIE_DOMAIN }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: pgko-web@${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: ${{ runner.temp }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >
            pages deploy ${{ github.workspace }}/apps/web/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || 'pgko' }}
            --branch=main
            --commit-hash=${{ github.sha }}
