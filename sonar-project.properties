sonar.projectKey=pgko-dev_pgko
sonar.projectName=pgko
sonar.host.url=https://sonarcloud.io
sonar.organization=pgko-dev
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__test__/**,**/__tests__/**,**/test/**,**/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/out/**,**/coverage/**,**/.scannerwork/**,**/.cache/**,**/.tanstack/**,**/vendor/**,**/*.d.ts,**/*.gen.ts,**/*.min.js,**/*.min.css
sonar.coverage.exclusions=**/*

sonar.cpd.exclusions=packages/i18n/src/**

# Rule-specific exceptions for reviewed sequencing and framework/translation false positives.
sonar.issue.ignore.multicriteria=packageBuild,packCheck,publish,registryPolling,uploadSequencing,retryJitter,inputPointerRole,inputPointerKeyboard,translationLabels

# Package builds and publication follow dependency order; artifact checks reuse shared state.
sonar.issue.ignore.multicriteria.packageBuild.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.packageBuild.resourceKey=scripts/build.ts
sonar.issue.ignore.multicriteria.packCheck.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.packCheck.resourceKey=scripts/pack-check.ts
sonar.issue.ignore.multicriteria.publish.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.publish.resourceKey=scripts/publish.ts

# Polling, retry backoff, and each bounded upload worker require sequential awaits.
sonar.issue.ignore.multicriteria.registryPolling.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.registryPolling.resourceKey=scripts/verify-release.ts
sonar.issue.ignore.multicriteria.uploadSequencing.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.uploadSequencing.resourceKey=apps/web/src/lib/multipart-bundle-upload.ts
sonar.issue.ignore.multicriteria.retryJitter.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.retryJitter.resourceKey=apps/web/src/lib/multipart-bundle-upload.ts

# Pointer convenience focuses the already tabbable input; the addon can contain buttons.
sonar.issue.ignore.multicriteria.inputPointerRole.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.inputPointerRole.resourceKey=apps/web/src/components/ui/input-group.tsx
sonar.issue.ignore.multicriteria.inputPointerKeyboard.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.inputPointerKeyboard.resourceKey=apps/web/src/components/ui/input-group.tsx

# Japanese password labels are UI translations, not credentials.
sonar.issue.ignore.multicriteria.translationLabels.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.translationLabels.resourceKey=packages/i18n/src/ja/ui.ts
